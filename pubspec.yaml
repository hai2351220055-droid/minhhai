name: minhhai
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # 🧠 Lưu thông tin người dùng
  shared_preferences: ^2.3.3

  # 🍎 Icon cho iOS
  cupertino_icons: ^1.0.8

  # 🗄️ SQLite Database
  sqflite: ^2.3.0
  path: ^1.8.0
  path_provider: ^2.1.5

  # 🎵 Phát nhạc
  audioplayers: ^6.0.0
  just_audio: ^0.10.5
  audio_video_progress_bar: ^2.0.3

  # 📄 Xuất PDF (có hỗ trợ tiếng Việt)
  pdf: ^3.11.0
  printing: ^5.13.1

  # 🖼️ Chọn ảnh / tải file
  image_picker: ^1.1.2
  file_picker: ^10.3.3

  # 🕓 Format ngày giờ
  intl: ^0.19.0

  # 🔐 Mã hóa mật khẩu
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # 📦 Tài nguyên (hình, nhạc, font)
  assets:
    - assets/images/dau.jpg        # ảnh logo bạn muốn gán cho mỗi bài hát
    - assets/images/               # thư mục chứa ảnh khác
    - assets/music/                # nhạc
    - assets/fonts/roboto/         # font

  # 🔤 Font tùy chọn (PDF hỗ trợ tiếng Việt)
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/roboto/Roboto-Regular.ttf
        - asset: assets/fonts/roboto/Roboto-Bold.ttf
        - asset: assets/fonts/roboto/Roboto-Italic.ttf
